prompt.01.title=Mockup de producto digital
prompt.01.objective=Presentar un recurso digital como producto comercial tridimensional.
prompt.01.body=Genera un mockup 3D profesional de [PRODUCTO DIGITAL], con colores [COLORES], fondo [FONDO], iluminación de estudio y sombras naturales. Destaca el producto con una composición limpia y atractiva. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto una portada, respeta su diseño, logotipo y textos originales.
prompt.02.title=Presentación en dispositivos
prompt.02.objective=Mostrar cómo luce el contenido digital dentro de un dispositivo.
prompt.02.body=Genera una presentación profesional de [PRODUCTO DIGITAL] en [LAPTOP, TABLET O CELULAR], con orientación [VERTICAL U HORIZONTAL] y vista [FRONTAL, LATERAL O TRES CUARTOS]. Respeta las proporciones físicas reales de cada dispositivo, manteniendo una relación coherente entre pantalla, marco, teclado y base, sin estirar, comprimir ni deformar sus dimensiones. Utiliza colores [COLORES], fondo [FONDO], iluminación natural y una composición moderna. Muestra el contenido claramente en la pantalla, adaptándolo a su formato sin distorsiones ni recortes innecesarios. Genera la imagen final en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto una imagen, conserva su diseño y textos originales.
prompt.03.title=Publicidad creativa en 3D
prompt.03.objective=Crear una composición publicitaria llamativa con profundidad y elementos tridimensionales.
prompt.03.body=Genera una imagen publicitaria 3D de [PRODUCTO], con el producto como protagonista y elementos [FLOTANTES, GEOMÉTRICOS O DINÁMICOS] a su alrededor. Mantén una composición visualmente equilibrada, sin colocar demasiados elementos en un solo lado. Evita duplicar o repetir elementos innecesariamente y respeta las proporciones originales, sin distorsiones. Utiliza colores [COLORES], fondo [FONDO], iluminación cinematográfica y sombras realistas. Crea una composición impactante en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto una imagen del producto, conserva su forma, marca y detalles originales.
prompt.04.title=Vista explotada 3D
prompt.04.objective=Mostrar componentes separados y ordenados según su posición de ensamblaje.
prompt.04.body=Genera una vista explotada 3D de [PRODUCTO], incluyendo en la parte superior de la imagen un título descriptivo que identifique el producto. Muestra sus componentes separados y ordenados según su posición original de ensamblaje, así como el nombre de cada uno. Mantén las proporciones, una distribución visual equilibrada y espacios uniformes entre piezas. Evita duplicar componentes o agregar piezas inexistentes. Utiliza fondo [FONDO], iluminación de estudio y proporción final [1:1, 4:5, 9:16 O 16:9]. Si adjunto una imagen, respeta sus características originales y representa únicamente los componentes que puedan identificarse con certeza.
prompt.05.title=Estilo premium minimalista
prompt.05.objective=Destacar un producto mediante una estética sencilla, elegante y despejada.
prompt.05.body=Genera una imagen de estilo premium minimalista de [PRODUCTO], utilizando colores [COLORES], fondo [FONDO] e iluminación suave y elegante. Destaca el producto como protagonista, con espacios despejados, sombras naturales y una composición visualmente equilibrada. Evita elementos decorativos innecesarios, repeticiones y distorsiones. No inventes ni muestres marcas, logotipos ni nombres comerciales en el producto o empaque. Si el diseño incluye texto, utiliza únicamente texto genérico o descriptivo relacionado con la categoría del producto, por ejemplo «Eau de parfum», sin crear una marca ficticia. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto una imagen del producto, conserva su forma, marca y detalles originales.
prompt.06.title=Escenas y espacios isométricos
prompt.06.objective=Representar espacios, negocios o sistemas desde una perspectiva tridimensional organizada.
prompt.06.body=Genera una escena isométrica 3D de [ESPACIO, NEGOCIO O SISTEMA], incluyendo en la parte superior de la imagen un título descriptivo que identifique el espacio, negocio o sistema. Muestra [ELEMENTOS PRINCIPALES] desde una vista elevada de aproximadamente 30°. Utiliza colores [COLORES], fondo [FONDO] e iluminación suave. Mantén una perspectiva isométrica coherente, proporciones uniformes y una distribución visual equilibrada. Evita duplicar elementos, agregar objetos innecesarios o distorsionar las estructuras. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9].
prompt.07.title=Fotografía comercial de producto
prompt.07.objective=Representar un producto con realismo y atención a materiales, texturas y detalles.
prompt.07.body=Genera una fotografía comercial realista de [PRODUCTO], con presentación [FRONTAL, LATERAL O TRES CUARTOS], iluminación [SUAVE, NATURAL O DE ESTUDIO] y fondo [FONDO]. Destaca sus materiales, colores y texturas, utilizando sombras naturales y una composición visualmente equilibrada. Evita distorsiones visuales, reflejos excesivos y elementos innecesarios. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto una fotografía del producto, conserva fielmente su diseño, marca y características originales.
prompt.08.title=Fotografía desde arriba
prompt.08.objective=Organizar productos y accesorios sobre una superficie y fotografiarlos desde arriba.
prompt.08.body=Genera una fotografía profesional tipo flat lay de [PRODUCTO O CONJUNTO DE OBJETOS], vistos directamente desde arriba, con una cámara perpendicular a la superficie. Organiza los elementos sobre [SUPERFICIE O FONDO], utilizando colores [COLORES] e iluminación [NATURAL O DE ESTUDIO]. Mantén una distribución visual equilibrada, espacios adecuados y sombras suaves. [MOSTRAR NOMBRES: SÍ O NO]. Si se solicita mostrar los nombres, identifica cada objeto mediante una etiqueta breve y legible, sin ocultar sus detalles. Evita objetos duplicados, distorsiones y elementos innecesarios. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9]. Si adjunto imágenes de referencia, conserva sus características originales.
prompt.09.title=Infografía visual
prompt.09.objective=Comunicar información rápidamente mediante elementos gráficos y texto mínimo.
prompt.09.body=Genera una infografía visual sobre [TEMA], utilizando [INFORMACIÓN O DATOS]. Prioriza ilustraciones, íconos, diagramas y recursos gráficos sobre el texto. Utiliza únicamente títulos breves, cifras clave y etiquetas indispensables, en [IDIOMA]. Aplica colores [COLORES], fondo [FONDO] y una composición equilibrada, con jerarquía visual clara y espacios adecuados. Evita párrafos, información repetida, elementos duplicados y datos inventados. Genera la imagen en proporción [1:1, 4:5, 9:16 O 16:9].
prompt.10.title=Carrusel para redes sociales
prompt.10.objective=Crear una secuencia visual coherente que capte la atención y comunique una idea por imagen.
prompt.10.body=Diseña un carrusel de [NÚMERO] imágenes para [INSTAGRAM O FACEBOOK] sobre [TEMA O PRODUCTO]. Utiliza una primera imagen impactante y desarrolla una idea visual por imagen. Reserva exclusivamente la última imagen para [MENSAJE O LLAMADO A LA ACCIÓN], de forma breve, visible y coherente con el tema. Las imágenes anteriores deben desarrollar el contenido sin incluir llamados a la acción. Prioriza fotografías, ilustraciones e íconos sobre el texto, utilizando únicamente frases breves en [IDIOMA]. Mantén colores [COLORES], estilo visual consistente, composición equilibrada y elementos sin duplicaciones innecesarias. Organiza las imágenes en una secuencia lógica para mantener la continuidad del mensaje, incluso si cambia su orden. Identifica cada imagen por su número de secuencia, sin incluirlo en el diseño visual. Genera exactamente la cantidad solicitada de imágenes independientes, cada una por separado, nunca como mosaico, en proporción [1:1 O 4:5], conservando el mismo formato en todo el carrusel. Comprueba que la secuencia esté completa, sin contar dos veces la imagen seleccionada en la galería.

prompt.04.note=3D representa geometría estática; 4D incorpora tiempo mediante vídeo o animación. En construcción, BIM (Building Information Modeling | Modelado de Información de la Construcción) 5D incorpora información de costes. Una imagen estática no equivale a una animación 4D.
prompt.06.note=Una perspectiva isométrica estricta mantiene ejes paralelos y no utiliza puntos de fuga, a diferencia de otras vistas tridimensionales elevadas.
prompt.06.tip=Cuando se requiere precisión espacial o técnica, conviene proporcionar un plano o una imagen de referencia en lugar de depender únicamente de instrucciones escritas. Esto ayuda a conservar la distribución, las proporciones, los accesos y la relación funcional entre los elementos.
prompt.09.note=Comprobar siempre las cifras y etiquetas generadas; la información visual no debe sacrificar precisión.
prompt.10.note=En caso de estar sin acceso a la generación de imágenes, utiliza este prompt para planificar la secuencia del carrusel y preparar las instrucciones de cada pieza. Podrás generar las imágenes posteriormente o utilizar recursos propios.

