prompt.01.title=Digital product mockup
prompt.01.objective=Showcase a digital product through a professional 3D mockup.
prompt.01.body=Create a professional 3D mockup of [DIGITAL PRODUCT], using [COLOURS], [BACKGROUND], studio lighting and realistic shadows. Make the product stand out with a clean, visually appealing composition. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If a cover image is provided, preserve its original design, logo and text.
prompt.02.title=Device showcase
prompt.02.objective=Showcase how digital content appears on a device.
prompt.02.body=Create a professional showcase of [DIGITAL PRODUCT] displayed on a [LAPTOP, TABLET OR MOBILE PHONE], in [PORTRAIT OR LANDSCAPE] orientation and viewed from the [FRONT, SIDE OR THREE-QUARTER ANGLE]. Respect the realistic physical proportions of each device, maintaining a consistent relationship between the screen, frame, keyboard and base, without stretching, compressing or distorting their dimensions. Use [COLOURS], [BACKGROUND], natural lighting and a modern, polished composition. Make sure the content is clearly visible on the screen, adapting it to the display format without distortion or unnecessary cropping. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If a reference image is provided, preserve its original design and text.
prompt.03.title=Creative 3D advertising
prompt.03.objective=Create an eye-catching advertisement with depth and three-dimensional elements.
prompt.03.body=Create a striking 3D advertisement for [PRODUCT], making it the main focus and surrounding it with [FLOATING, GEOMETRIC OR DYNAMIC] elements. Keep the composition visually balanced, without placing too many elements on one side. Avoid unnecessary repetition or duplicated objects, and preserve the original proportions of the product without distortion. Use [COLOURS], [BACKGROUND], cinematic lighting and realistic shadows. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If a product reference image is provided, preserve its original shape, branding and details.
prompt.04.title=Exploded view
prompt.04.objective=Show the individual components of a product, separated and arranged according to their original assembly positions.
prompt.04.body=Create a 3D exploded view of [PRODUCT], including a descriptive title at the top of the image that identifies the product. Show its components separated and arranged according to their original assembly positions, with each component clearly labelled by name. Present the product from [ORIENTATION OR VIEWING ANGLE], maintaining a consistent perspective that makes it easy to identify the parts and understand how they fit together. Preserve accurate proportions, a balanced visual layout, and uniform spacing between components. Avoid duplicating components or adding parts that do not exist. Use a [BACKGROUND] background, studio lighting, and a final aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If I attach an image, preserve its original characteristics and represent only the components that can be identified with certainty.
prompt.05.title=Premium minimalist style
prompt.05.objective=Showcase a product through a clean, elegant and minimalist visual style.
prompt.05.body=Create a premium minimalist image of [PRODUCT], using [COLOURS], [BACKGROUND] and soft, elegant lighting. Make the product the main focus, with plenty of open space, natural shadows and a visually balanced composition. Avoid unnecessary decorative elements, repetition and distortion. Do not invent or display brand names, logos or commercial names on the product or packaging. If the design includes text, use only generic or descriptive text related to the product category, for example “Eau de parfum”, without creating a fictional brand. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If a product reference image is provided, preserve its original shape, branding and details.
prompt.06.title=Isometric scenes
prompt.06.objective=Present spaces, businesses or systems in a clear, organised three-dimensional view.
prompt.06.body=Create a 3D isometric scene of [SPACE, BUSINESS OR SYSTEM], including a descriptive title at the top of the image that identifies the space, business or system. Show [MAIN ELEMENTS] from an elevated angle of approximately 30°. Use [COLOURS], [BACKGROUND] and soft lighting. Maintain a consistent isometric perspective, accurate proportions and a visually balanced composition. Avoid duplicated elements, unnecessary objects and distorted structures. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9].
prompt.07.title=Commercial product photography
prompt.07.objective=Showcase a product realistically, highlighting its materials, textures and details.
prompt.07.body=Create a realistic commercial photograph of [PRODUCT], viewed from the [FRONT, SIDE OR THREE-QUARTER ANGLE], with [SOFT, NATURAL OR STUDIO] lighting and [BACKGROUND]. Highlight the materials, colours and textures of the product, using natural shadows and a visually balanced composition. Avoid visual distortions, excessive reflections and unnecessary elements. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If a product reference photograph is provided, preserve its original design, branding and features.
prompt.08.title=Flat lay photography
prompt.08.objective=Arrange products and accessories on a flat surface and photograph them from directly above.
prompt.08.body=Create a professional flat lay photograph of [PRODUCT OR COLLECTION OF OBJECTS], viewed directly from above with the camera positioned perpendicular to the surface. Arrange the items on [SURFACE OR BACKGROUND], using [COLOURS] and [NATURAL OR STUDIO] lighting. Keep the composition visually balanced, with enough space between objects and soft shadows. [DISPLAY NAMES: YES OR NO]. If names are requested, identify each object with a short, legible label without obscuring its details. Avoid duplicated items, distortion and unnecessary elements. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9]. If reference images are provided, preserve the original features of the objects.
prompt.09.title=Visual infographic
prompt.09.objective=Communicate information quickly and clearly through visual elements with minimal text.
prompt.09.body=Create a visual infographic about [TOPIC], using [INFORMATION OR DATA]. Focus on illustrations, icons, diagrams and other visual elements rather than text. Use only short headings, key figures and essential labels in [LANGUAGE]. Apply [COLOURS], [BACKGROUND] and a visually balanced layout, with information that is easy to follow and enough space between elements. Avoid paragraphs, repeated information, duplicated objects and invented data. Use an aspect ratio of [1:1, 4:5, 9:16 OR 16:9].
prompt.10.title=Social media carousel
prompt.10.objective=Create a consistent series of images that captures attention and communicates one idea per image.
prompt.10.body=Create a carousel of [NUMBER] images for [INSTAGRAM OR FACEBOOK] about [TOPIC OR PRODUCT]. Start with an eye-catching image and present one visual idea per image. Reserve the final image exclusively for [MESSAGE OR CALL TO ACTION], keeping it brief, visible and relevant to the topic. The preceding images should develop the content without including calls to action. Focus on photographs, illustrations and icons rather than text, using only short phrases in [LANGUAGE]. Use [COLOURS], a consistent visual style and balanced compositions, avoiding unnecessary duplicated elements. Arrange the images in a logical order so the message flows naturally, even if the sequence changes. Identify each image by its position in the sequence without displaying the number in the design. Generate exactly the requested number of independent images, each separately, never as a collage, using the same [1:1 OR 4:5] aspect ratio throughout the carousel. Verify that the sequence is complete without counting the selected image in the gallery twice.

prompt.04.note=A 3D exploded view shows components separated in a static image. A 4D representation adds time through video or animation. In construction, 5D BIM (Building Information Modeling) also incorporates cost information. A static image is not a 4D animation. See references at the end of this guide.
prompt.06.note=A true isometric projection uses parallel axes and has no vanishing points, unlike other elevated three-dimensional views.
prompt.06.tip=When spatial or technical accuracy matters, provide a floor plan or reference image rather than relying on written instructions alone. This helps preserve the layout, proportions, access points and functional relationships between elements.
prompt.09.note=Always check the accuracy of figures and labels. Visual simplicity should never come at the expense of accuracy.
prompt.10.note=If image generation is unavailable, use this prompt to plan the carousel sequence and prepare the instructions for each image. You can generate the images later or use your own visual resources.

